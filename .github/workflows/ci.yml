name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ 3.13, 3.12 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 black mypy

      - name: Skip Windows-specific dependencies
        run: |
          # Create a mock for pywin32 to avoid installation issues on Linux
          mkdir -p mock_modules
          echo "# Mock pywin32 module" > mock_modules/win32com.py
          echo "class client: 
                  class Dispatch:
                    def __init__(self, *args, **kwargs): pass
                    def CreateShortcut(self, *args, **kwargs): 
                      class Shortcut:
                        def __init__(self): pass
                        def Save(self): pass
                        TargetPath = ''
                      return Shortcut()" >> mock_modules/win32com.py
          echo "# Mock winreg module" > mock_modules/winreg.py
          echo "HKEY_CURRENT_USER = 0
                KEY_SET_VALUE = 0
                REG_SZ = 0
                def OpenKey(*args, **kwargs): 
                  class Key:
                    def __init__(self): pass
                    def __enter__(self): return self
                    def __exit__(self, *args): pass
                  return Key()
                def SetValueEx(*args, **kwargs): pass" >> mock_modules/winreg.py
          
          # Add the mock directory to Python path
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)/mock_modules" >> $GITHUB_ENV

      - name: Run tests
        run: |
          pytest

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: |
          black --check src/

      - name: Type check with mypy
        run: |
          mypy --ignore-missing-imports src/